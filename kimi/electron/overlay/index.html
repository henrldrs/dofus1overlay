<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://* data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:5000 https://*">
  <title>Dofus Retro Companion</title>
  <style>
    /* FIX 1: Robust Flexbox Scrolling */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      padding: 12px;
      background: var(--bg); backdrop-filter: blur(14px);
      color: var(--text); font-family: 'Segoe UI', sans-serif;
      border-radius: 12px; border: 1px solid var(--border);
      user-select: none; transition: background 0.3s, color 0.3s;
    }
    :root {
      --bg: rgba(20, 20, 25, 0.92);
      --border: rgba(255,255,255,0.1);
      --text: #e0e0e0;
      --dim: #888;
      --gold: #d4af37;
      --hover: rgba(255,255,255,0.07);
      --card-bg: rgba(30, 30, 35, 0.8);
      --input-bg: rgba(0,0,0,0.3);
      --red: #e74c3c; --blue: #3498db; --green: #2ecc71;
      --fire: #e74c3c; --water: #3498db; --earth: #e67e22; --air: #9b59b6; --neutral: #95a5a6;
    }
    body.light {
      --bg: rgba(245, 245, 250, 0.95); --border: rgba(0,0,0,0.15);
      --text: #1a1a1a; --dim: #666; --gold: #b8860b;
      --hover: rgba(0,0,0,0.05); --input-bg: rgba(255,255,255,0.8);
    }
    .drag { height: 20px; width: 100%; position: absolute; top: 0; left: 0; -webkit-app-region: drag; }
    .tabs { display: flex; gap: 3px; margin-bottom: 10px; margin-top: 6px; flex-wrap: wrap; }
    .tab {
      flex: 1; padding: 6px 4px; text-align: center; font-size: 11px; font-weight: 600;
      background: var(--hover); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; color: var(--dim); transition: all 0.2s; min-width: 60px;
    }
    .tab.active { background: rgba(212,175,55,0.15); color: var(--gold); border-color: var(--gold); }
    .tab:hover { background: rgba(255,255,255,0.1); }
    
    .search-box, .filter-select, .form-group input, .form-group select {
      width: 100%; padding: 8px 12px; background: var(--input-bg);
      border: 1px solid var(--border); color: var(--text); border-radius: 6px;
      outline: none; font-size: 13px; margin-bottom: 6px;
    }
    .search-box:focus, .filter-select:focus, .form-group input:focus, .form-group select:focus { border-color: var(--gold); }
    .filters { display: flex; gap: 6px; margin-bottom: 8px; }
    .filters select { flex: 1; }
    
    /* FIX 1b: Content area must shrink to allow scrolling */
    .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
    .view.active { display: flex; }
    .content { flex: 1; overflow-y: auto; min-height: 0; padding-right: 4px; }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    
    .card {
      padding: 8px 10px; margin-bottom: 6px; background: var(--hover);
      border-radius: 6px; cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .card:hover { background: rgba(255,255,255,0.12); }
    
    /* FIX 2: Bulletproof Icon Renderer */
    .icon { 
      background: var(--input-bg); border-radius: 4px; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid var(--border); flex-shrink: 0; overflow: hidden;
      position: relative;
    }
    .icon img { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; background: transparent; }
    .icon .fallback { position: absolute; z-index: 1; font-size: 18px; opacity: 0.8; }
    
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; font-size: 13px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 4px; }
    .badge-boss { background: rgba(231,76,60,0.2); color: var(--red); }
    .badge-weak { background: rgba(52,152,219,0.2); color: var(--blue); }
    .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 12px 0 8px 0; }
    .back-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 16px; margin-right: 6px; display: none; }
    .detail-header { text-align: center; margin-bottom: 12px; }
    .detail-name { font-size: 16px; color: var(--gold); margin: 6px 0 2px; }
    .detail-type { font-size: 11px; color: var(--dim); }
    .stat-row, .recipe-row, .drop-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 3px; }
    .drop-row { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .qty-input { width: 50px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); text-align: center; border-radius: 4px; padding: 3px; font-size: 12px; }
    .farm-btn, .save-btn { padding: 6px 14px; background: rgba(212,175,55,0.2); border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .farm-btn:hover, .save-btn:hover { background: rgba(212,175,55,0.35); }
    .empty { padding: 20px; text-align: center; color: var(--dim); font-size: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .profile-card { padding: 14px; background: rgba(212,175,55,0.08); border: 1px solid var(--gold); border-radius: 8px; margin-bottom: 12px; }
    .profile-card .name { font-size: 16px; margin-bottom: 4px; }
    .profile-card .meta { font-size: 12px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: var(--green); color: #fff; border-radius: 6px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    .drop-rate { color: var(--gold); font-weight: 600; font-size: 11px; }
    .item-with-icon { display: flex; align-items: center; gap: 8px; }
    .element-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .element-fire { background: rgba(231,76,60,0.2); color: var(--fire); }
    .element-water { background: rgba(52,152,219,0.2); color: var(--water); }
    .element-earth { background: rgba(230,126,34,0.2); color: var(--earth); }
    .element-air { background: rgba(155,89,182,0.2); color: var(--air); }
    .element-neutral { background: rgba(149,165,166,0.2); color: var(--neutral); }
    .farm-banner { padding: 10px; background: rgba(212,175,55,0.08); border: 1px solid var(--gold); border-radius: 6px; margin-bottom: 10px; font-size: 12px; }
    .farm-banner strong { color: var(--gold); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 8px; background: var(--hover); border-radius: 6px; }
    .setting-row label { font-size: 12px; color: var(--text); }
    .setting-row input[type="range"] { flex: 1; margin: 0 10px; accent-color: var(--gold); }
    .setting-row .value { font-size: 12px; color: var(--gold); font-weight: 600; min-width: 40px; text-align: right; }
    .theme-toggle { display: flex; gap: 6px; }
    .theme-btn { flex: 1; padding: 8px; background: var(--hover); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 12px; }
    .theme-btn.active { background: rgba(212,175,55,0.2); border-color: var(--gold); color: var(--gold); }
    .reset-btn { width: 100%; padding: 8px; background: rgba(231,76,60,0.1); border: 1px solid var(--red); color: var(--red); border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="drag"></div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('search')">🔍 Search</div>
    <div class="tab" onclick="switchTab('farm')">⚔️ Farm</div>
    <div class="tab" onclick="switchTab('profile')">👤 Profile</div>
    <div class="tab" onclick="switchTab('settings')">⚙️ Settings</div>
  </div>

  <div id="view-search" class="view active">
    <div style="display:flex;align-items:center;">
      <button class="back-btn" id="backBtn" onclick="showSearch()">←</button>
      <input type="text" id="searchInput" class="search-box" placeholder="Search items..." style="flex:1;margin:0;" />
    </div>
    <div class="filters">
      <select id="typeFilter" class="filter-select" onchange="doSearch(document.getElementById('searchInput').value.trim())"><option value="">All Types</option></select>
      <select id="levelFilter" class="filter-select" onchange="doSearch(document.getElementById('searchInput').value.trim())">
        <option value="">All Levels</option><option value="1-50">1-50</option><option value="51-100">51-100</option><option value="101-150">101-150</option><option value="151-200">151-200</option>
      </select>
    </div>
    <div class="content" id="searchContent"></div>
  </div>

  <div id="view-farm" class="view">
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <input type="number" id="farmLevel" class="filter-select" value="50" min="1" max="200" style="width:70px;flex:none;margin:0;" />
      <select id="elementFilter" class="filter-select" style="flex:1;margin:0;">
        <option value="">Any Element</option><option value="fire">🔥 Fire</option><option value="water">💧 Water</option><option value="earth">🌍 Earth</option><option value="air">💨 Air</option><option value="neutral">⚪ Neutral</option>
      </select>
      <button class="farm-btn" onclick="loadFarmSuggestions()">Suggest</button>
    </div>
    <div class="content" id="farmContent"><div class="empty">Loading...</div></div>
  </div>

  <div id="view-profile" class="view">
    <div class="content">
      <div id="currentProfile"></div>
      <div class="section-title">Character Details</div>
      <div class="form-group"><label>Character Name</label><input type="text" id="profileName" placeholder="e.g. Henrioutai" /></div>
      <div class="form-group"><label>Level</label><input type="number" id="profileLevel" placeholder="60" min="1" max="200" /></div>
      <div class="form-group"><label>Main Profession</label><input type="text" id="profileProfession" placeholder="e.g. Forgemage" /></div>
      <div class="section-title">Characteristics</div>
      <div class="stats-grid">
        <div class="form-group"><label>Strength</label><input type="number" id="statStrength" value="0" min="0" /></div>
        <div class="form-group"><label>Intelligence</label><input type="number" id="statIntelligence" value="0" min="0" /></div>
        <div class="form-group"><label>Agility</label><input type="number" id="statAgility" value="0" min="0" /></div>
        <div class="form-group"><label>Chance</label><input type="number" id="statChance" value="0" min="0" /></div>
        <div class="form-group"><label>Vitality</label><input type="number" id="statVitality" value="0" min="0" /></div>
        <div class="form-group"><label>Wisdom</label><input type="number" id="statWisdom" value="0" min="0" /></div>
      </div>
      <div class="form-group"><label>Prospecting</label><input type="number" id="statProspecting" value="100" min="100" /></div>
      <div class="form-group"><label>Main Element</label>
        <select id="statElement"><option value="neutral">⚪ Neutral</option><option value="fire">🔥 Fire</option><option value="water">💧 Water</option><option value="earth">🌍 Earth</option><option value="air">💨 Air</option></select>
      </div>
      <button class="save-btn" onclick="saveProfile()"> Save Profile</button>
    </div>
  </div>

  <div id="view-settings" class="view">
    <div class="content">
      <div class="section-title">Window Size</div>
      <div class="setting-row"><label>Width</label><input type="range" id="widthSlider" min="300" max="1000" value="420" oninput="updateSizePreview()"><span class="value" id="widthValue">420px</span></div>
      <div class="setting-row"><label>Height</label><input type="range" id="heightSlider" min="400" max="900" value="620" oninput="updateSizePreview()"><span class="value" id="heightValue">620px</span></div>
      <button class="farm-btn" style="width:100%;margin-bottom:12px;" onclick="applySize()">Apply Size</button>
      <div class="section-title">Theme</div>
      <div class="theme-toggle">
        <button class="theme-btn active" id="darkBtn" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="theme-btn" id="lightBtn" onclick="setTheme('light')">☀️ Light</button>
      </div>
      <div class="section-title">About</div>
      <div style="font-size:11px;color:var(--dim);line-height:1.5;">
        <strong>Dofus Rétro Companion v1.0</strong><br>
        • 11,716 items with recipes<br>• 133 monsters with drops<br>
        • Press <strong>Alt+Shift+D</strong> to toggle overlay
      </div>
      <button class="reset-btn" onclick="resetSettings()">Reset to Defaults</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = 'http://127.0.0.1:5000/api';
    let debounce, currentProfile = null;

    // FIX 2: Bulletproof Icon Renderer
    function renderIcon(url, fallback, size = 36) {
      const fb = fallback || '📦';
      const imgSrc = url ? url : '';
      return `<div class="icon" style="width:${size}px;height:${size}px;">
        <span class="fallback" style="font-size:${size*0.55}px;">${fb}</span>
        <img src="${imgSrc}" onerror="this.style.display='none'" alt="">
      </div>`;
    }

    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.background = color || 'var(--green)';
      t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => {
        const idx = tab==='search'?0:tab==='farm'?1:tab==='profile'?2:3;
        t.classList.toggle('active', i===idx);
      });
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-'+tab).classList.add('active');
      if (tab === 'farm') loadFarmSuggestions();
      if (tab === 'profile') loadProfile();
      if (tab === 'settings') loadSettings();
    }

    function loadSettings() {
      const saved = localStorage.getItem('dofus_settings');
      if (saved) { try { const s = JSON.parse(saved); if (s.width) document.getElementById('widthSlider').value = s.width; if (s.height) document.getElementById('heightSlider').value = s.height; if (s.theme) setTheme(s.theme, false); } catch(e) {} }
      updateSizePreview();
    }
    function saveSettings() {
      localStorage.setItem('dofus_settings', JSON.stringify({
        width: parseInt(document.getElementById('widthSlider').value),
        height: parseInt(document.getElementById('heightSlider').value),
        theme: document.body.classList.contains('light') ? 'light' : 'dark'
      }));
    }
    function updateSizePreview() {
      document.getElementById('widthValue').textContent = document.getElementById('widthSlider').value + 'px';
      document.getElementById('heightValue').textContent = document.getElementById('heightSlider').value + 'px';
    }
    function applySize() {
      const w = parseInt(document.getElementById('widthSlider').value);
      const h = parseInt(document.getElementById('heightSlider').value);
      if (window.overlayAPI && window.overlayAPI.resizeWindow) {
        window.overlayAPI.resizeWindow(w, h).then(() => { showToast(`✅ Resized to ${w}x${h}`); saveSettings(); });
      } else { showToast('API not available'); }
    }
    function setTheme(theme, save = true) {
      if (theme === 'light') { document.body.classList.add('light'); document.getElementById('lightBtn').classList.add('active'); document.getElementById('darkBtn').classList.remove('active'); }
      else { document.body.classList.remove('light'); document.getElementById('darkBtn').classList.add('active'); document.getElementById('lightBtn').classList.remove('active'); }
      if (save) saveSettings();
    }
    function resetSettings() { localStorage.removeItem('dofus_settings'); document.getElementById('widthSlider').value = 420; document.getElementById('heightSlider').value = 620; setTheme('dark'); updateSizePreview(); showToast('Settings reset'); }

    async function loadProfile() {
      try {
        const r = await fetch(API+'/profile'); currentProfile = await r.json();
        const cp = document.getElementById('currentProfile');
        if (currentProfile.name) {
          cp.innerHTML = `<div class="profile-card"><div class="name">👤 ${currentProfile.name}</div><div class="meta">Level ${currentProfile.level} ${currentProfile.profession?'• '+currentProfile.profession:''}</div><div class="meta" style="margin-top:4px;"><span class="element-badge element-${currentProfile.main_element||'neutral'}">${currentProfile.main_element||'neutral'}</span></div></div>`;
          document.getElementById('profileName').value = currentProfile.name;
          document.getElementById('profileLevel').value = currentProfile.level;
          document.getElementById('profileProfession').value = currentProfile.profession || '';
          document.getElementById('statStrength').value = currentProfile.strength || 0;
          document.getElementById('statIntelligence').value = currentProfile.intelligence || 0;
          document.getElementById('statAgility').value = currentProfile.agility || 0;
          document.getElementById('statChance').value = currentProfile.chance || 0;
          document.getElementById('statVitality').value = currentProfile.vitality || 0;
          document.getElementById('statWisdom').value = currentProfile.wisdom || 0;
          document.getElementById('statProspecting').value = currentProfile.prospecting || 100;
          document.getElementById('statElement').value = currentProfile.main_element || 'neutral';
          document.getElementById('farmLevel').value = currentProfile.level;
          document.getElementById('elementFilter').value = currentProfile.main_element || '';
        } else { cp.innerHTML = '<div class="empty">No profile saved yet.</div>'; }
      } catch(e) { console.error(e); }
    }
    async function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      if (!name) { showToast('Name required!', 'var(--red)'); return; }
      const data = { name, level: parseInt(document.getElementById('profileLevel').value)||1, profession: document.getElementById('profileProfession').value.trim(), strength: parseInt(document.getElementById('statStrength').value)||0, intelligence: parseInt(document.getElementById('statIntelligence').value)||0, agility: parseInt(document.getElementById('statAgility').value)||0, chance: parseInt(document.getElementById('statChance').value)||0, vitality: parseInt(document.getElementById('statVitality').value)||0, wisdom: parseInt(document.getElementById('statWisdom').value)||0, prospecting: parseInt(document.getElementById('statProspecting').value)||100, main_element: document.getElementById('statElement').value };
      try { const r = await fetch(API+'/profile', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }); if (r.ok) { showToast('✅ Profile saved!'); loadProfile(); } else showToast('Error', 'var(--red)'); } catch(e) { showToast('Backend offline', 'var(--red)'); }
    }

    const searchInput = document.getElementById('searchInput');
    const searchContent = document.getElementById('searchContent');
    const backBtn = document.getElementById('backBtn');
    fetch(API+'/types').then(r => r.json()).then(types => { const select = document.getElementById('typeFilter'); types.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; select.appendChild(opt); }); }).catch(e => console.error(e));
    searchInput.addEventListener('input', e => { clearTimeout(debounce); const q = e.target.value.trim(); if (q.length < 2) { searchContent.innerHTML = ''; return; } debounce = setTimeout(() => doSearch(q), 250); });

    async function doSearch(q) {
      if (!q || q.length < 2) return;
      const type = document.getElementById('typeFilter').value;
      const levelRange = document.getElementById('levelFilter').value;
      let minLevel = 0, maxLevel = 200;
      if (levelRange) { const [min, max] = levelRange.split('-').map(Number); minLevel = min; maxLevel = max; }
      try {
        const r = await fetch(API+`/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&min_level=${minLevel}&max_level=${maxLevel}`);
        const items = await r.json();
        searchContent.innerHTML = items.length ? items.map(i => `<div class="card" onclick="loadItem(${i.id})">${renderIcon(i.icon_url, '')}<div class="info"><div class="name">${i.name}</div><div class="meta">Lvl ${i.level} • ${i.type}</div></div></div>`).join('') : '<div class="empty">No items found.</div>';
      } catch(e) { searchContent.innerHTML = '<div class="empty" style="color:#f55;">Backend offline.</div>'; }
    }

    async function loadItem(id) {
      try {
        const [iR, rR] = await Promise.all([fetch(API+'/items/'+id), fetch(API+'/recipes/breakdown/'+id+'?qty=1')]);
        const item = await iR.json(); const recipe = await rR.json();
        searchInput.style.display = 'none'; backBtn.style.display = 'block'; document.querySelector('.filters').style.display = 'none';
        let stats = (item.stats||[]).map(s => `<div class="stat-row"><span>${s.stat||s}</span></div>`).join('') || '<div style="color:#666;font-size:12px;">No stats.</div>';
        let mats = (recipe.raw_materials||[]).map(m => `<div class="recipe-row"><div class="item-with-icon">${renderIcon(m.icon_url, '📦', 24)}<span>${m.name}</span></div><span style="color:var(--gold);font-weight:600;">${m.quantity}</span></div>`).join('') || '<div style="color:#666;font-size:12px;">No recipe.</div>';
        let drops = (item.drops||[]).map(d => `<div class="drop-row"><div class="item-with-icon">${renderIcon(d.monster_icon, '👹', 24)}<span>${d.monster_name}</span></div><span class="drop-rate">${d.drop_rate ? d.drop_rate + '%' : '?'}</span></div>`).join('') || '<div style="color:#666;font-size:12px;">No known drops.</div>';
        searchContent.innerHTML = `<div class="detail-header">${renderIcon(item.icon_url, '📦', 64)}<h2 class="detail-name">${item.name}</h2><div class="detail-type">Level ${item.level} • ${item.type}</div></div><div class="section-title">Crafting Qty</div><input type="number" class="qty-input" value="1" min="1" onchange="updateQty(${item.id},this.value)" /><div class="section-title">Raw Materials</div><div id="mats">${mats}</div><div class="section-title">Stats</div>${stats}<div class="section-title">Drops From</div>${drops}`;
      } catch(e) { console.error(e); }
    }
    async function updateQty(id, qty) {
      const r = await fetch(API+'/recipes/breakdown/'+id+'?qty='+qty); const d = await r.json();
      document.getElementById('mats').innerHTML = (d.raw_materials||[]).map(m => `<div class="recipe-row"><div class="item-with-icon">${renderIcon(m.icon_url, '📦', 24)}<span>${m.name}</span></div><span style="color:var(--gold);font-weight:600;">${m.quantity}</span></div>`).join('');
    }
    function showSearch() { searchInput.style.display = 'block'; backBtn.style.display = 'none'; document.querySelector('.filters').style.display = 'flex'; searchContent.innerHTML = ''; searchInput.value = ''; searchInput.focus(); }

    async function loadFarmSuggestions() {
      const level = parseInt(document.getElementById('farmLevel').value) || 50;
      const element = document.getElementById('elementFilter').value;
      const fc = document.getElementById('farmContent'); fc.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const r = await fetch(API+`/farm/suggest?level=${level}&element=${encodeURIComponent(element)}`); const data = await r.json();
        let html = '';
        if (currentProfile && currentProfile.name) html += `<div class="farm-banner">🎯 <strong>${currentProfile.name}</strong> (Lvl ${level}) ${element ? `• <span class="element-badge element-${element}">${element}</span>` : ''}</div>`;
        if (data.monsters && data.monsters.length) {
          html += `<div class="section-title">Monsters${element ? ' weak to '+element : ''} (Lvl ${level-5}-${level+5})</div>`;
          html += data.monsters.map(m => { let badges = ''; if (m.boss) badges += '<span class="badge badge-boss">BOSS</span>'; if (m.weakness) badges += `<span class="badge badge-weak">Weak: ${m.weakness}</span>`; return `<div class="card" onclick="loadMonster(${m.id})">${renderIcon(m.icon_url, '👹')}<div class="info"><div class="name">${m.name} ${badges}</div><div class="meta">Level ${m.level_min} - ${m.level_max}</div></div></div>`; }).join('');
        } else { html += '<div class="empty">No monsters found.</div>'; }
        if (data.craftable_items && data.craftable_items.length) {
          html += '<div class="section-title">🔨 Craftable Items</div>';
          html += data.craftable_items.map(i => `<div class="card" onclick="switchTab('search');loadItem(${i.id})">${renderIcon(i.icon_url, '📦')}<div class="info"><div class="name">${i.name}</div><div class="meta">Lvl ${i.level} • ${i.type}</div></div></div>`).join('');
        }
        fc.innerHTML = html;
      } catch(e) { fc.innerHTML = '<div class="empty" style="color:#f55;">Backend offline.</div>'; }
    }
    async function loadMonster(id) {
      const fc = document.getElementById('farmContent');
      try {
        const r = await fetch(API+'/monsters/'+id); const m = await r.json();
        let drops = (m.drops||[]).map(d => `<div class="drop-row"><div class="item-with-icon">${renderIcon(d.icon_url, '📦', 24)}<span>${d.item_name}</span></div><span class="drop-rate">${d.drop_rate ? d.drop_rate + '%' : '?'}</span></div>`).join('') || '<div style="color:#666;font-size:12px;">No drops.</div>';
        let grades = (m.grades||[]).map(g => `<div class="stat-row"><span>Grade ${g.grade} (Lvl ${g.level})</span><span>HP:${g.hp} AP:${g.ap} PM:${g.mp}</span></div>`).join('') || '<div style="color:#666;font-size:12px;">No grade data.</div>';
        let resists = '';
        if (m.grades && m.grades[0] && m.grades[0].resist) { const r2 = m.grades[0].resist; resists = Object.entries(r2).map(([k,v]) => `<div class="stat-row"><span>${k}</span><span style="color:${v<0?'var(--red)':'var(--green)'}">${v>0?'+':''}${v}%</span></div>`).join(''); }
        fc.innerHTML = `<div style="margin-bottom:8px;"><button class="farm-btn" onclick="loadFarmSuggestions()">← Back</button></div><div class="detail-header">${renderIcon(m.icon_url, '', 64)}<h2 class="detail-name">${m.name}</h2><div class="detail-type">Level ${m.level_min} - ${m.level_max} ${m.boss?'<span class="badge badge-boss">BOSS</span>':''}</div>${m.weakness?`<div style="margin-top:4px;"><span class="badge badge-weak">Weakness: ${m.weakness}</span></div>`:''}</div><div class="section-title">Drops</div>${drops}<div class="section-title">Grades</div>${grades}${resists?'<div class="section-title">Resistances (Grade 1)</div>'+resists:''}`;
      } catch(e) { console.error(e); }
    }
    loadProfile(); loadSettings();
  </script>
</body>
</html>
